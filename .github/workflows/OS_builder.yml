name: Build OmniMow OS

on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: 'Select Ubuntu Version (noble or resolute)'
        required: true
        default: 'resolute'
        type: choice
        options:
          - noble
          - resolute
      create_release:
        description: 'Create a public GitHub Release automatically?'
        required: true
        type: boolean
        default: true

jobs:
  build-os:
    runs-on: ubuntu-24.04-arm 
    strategy:
      matrix:
        flavor: [cli, gnome]

    steps:
      - name: Checkout OmniMow scripts
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git fdisk udev xz-utils bdebstrap mmdebstrap jsonnet libguestfs-tools gdisk linux-image-generic dos2unix
          sudo chmod +r /boot/vmlinuz-* || true

      - name: Install rsdk
        run: |
          git clone --recurse-submodules https://github.com/RadxaOS-SDK/rsdk.git

      - name: Build Radxa Image (${{ matrix.flavor }})
        run: |
          cd rsdk
          export LIBGUESTFS_BACKEND=direct
          ./src/bin/rsdk build radxa-dragon-q6a ${{ inputs.ubuntu_version }} ${{ matrix.flavor }}

      - name: Inject OmniMow First-Boot Script
        run: |
          dos2unix inject.sh omnimow-first-boot.sh
          cp inject.sh rsdk/
          cp omnimow-first-boot.sh rsdk/
          cd rsdk
          chmod +x inject.sh
          sed -i 's|out/\*.img|out/*/*.img|g' inject.sh
          sudo ./inject.sh

      - name: Compress to .xz
        run: |
          cd rsdk
          xz -z -T0 -9 out/*/*.img

      # Upload to GitHub Actions temporary storage (necessary to pass it to the Release job)
      - name: Upload finished OmniMow OS
        uses: actions/upload-artifact@v4
        with:
          name: OmniMow-OS-${{ inputs.ubuntu_version }}-${{ matrix.flavor }}
          path: rsdk/out/*/*.img.xz

  # New job that gathers the files and creates a public Release
  release:
    needs: build-os
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial: Gives the workflow permission to create a release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          # Automatically tags the release with the build number
          tag_name: build-${{ github.run_number }}
          name: OmniMow OS (${{ inputs.ubuntu_version }}) - Build ${{ github.run_number }}
          draft: false
          prerelease: false
          # Uploads the raw .xz files without the zip wrapper
          files: artifacts/**/*.img.xz
