name: Build OmniMow OS

on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: 'Select Ubuntu Version (noble or resolute)'
        required: true
        default: 'resolute'
        type: choice
        options:
          - noble
          - resolute

jobs:
  build-os:
    runs-on: ubuntu-24.04-arm 

    steps:
      - name: Checkout OmniMow scripts
        uses: actions/checkout@v4

# Fetch the correct dependencies for native build (now with kernel image)
      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git fdisk udev xz-utils bdebstrap mmdebstrap jsonnet libguestfs-tools gdisk linux-image-generic
          sudo chmod +r /boot/vmlinuz-* || true

      # Clone rsdk with all submodules
      - name: Install rsdk
        run: |
          git clone --recurse-submodules https://github.com/RadxaOS-SDK/rsdk.git

      # Run the build command from the src/bin folder (forced direct backend)
      - name: Build Radxa Image
        run: |
          cd rsdk
          export LIBGUESTFS_BACKEND=direct
          ./src/bin/rsdk build radxa-dragon-q6a ${{ inputs.ubuntu_version }} cli

      - name: Inject OmniMow First-Boot Script
        run: |
          cp inject.sh rsdk/
          cp omnimow-first-boot.sh rsdk/
          cd rsdk
          chmod +x inject.sh
          # Ensure the inject script finds the file in Radxa's subfolders:
          sed -i 's|out/\*.img|out/*/*.img|g' inject.sh
          sudo ./inject.sh

      # Compress the found .img file in the subfolder
      - name: Compress to .xz
        run: |
          cd rsdk
          xz -z -T0 -9 out/*/*.img

      - name: Upload finished OmniMow OS
        uses: actions/upload-artifact@v4
        with:
          name: OmniMow-OS-${{ inputs.ubuntu_version }}
          path: rsdk/out/*/*.img.xz
