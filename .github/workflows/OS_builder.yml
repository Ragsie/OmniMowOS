name: Build OmniMow OS

on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: 'Select Ubuntu Version (noble or resolute)'
        required: true
        default: 'resolute'
        type: choice
        options:
          - noble
          - resolute
      create_release:
        description: 'Create a public GitHub Release automatically?'
        required: true
        type: boolean
        default: true

jobs:
  build-os:
    runs-on: ubuntu-24.04-arm 
    strategy:
      matrix:
        flavor: [cli, gnome]

    steps:
      - name: Checkout OmniMow scripts
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git fdisk udev xz-utils bdebstrap mmdebstrap jsonnet libguestfs-tools gdisk linux-image-generic dos2unix
          sudo chmod +r /boot/vmlinuz-* || true

      - name: Install rsdk
        run: |
          git clone --recurse-submodules https://github.com/RadxaOS-SDK/rsdk.git

      # Check cache for an existing clean base image
      - name: Cache Clean Base Image
        id: cache-base
        uses: actions/cache@v4
        with:
          path: clean_base_image/
          # Change '-v1' to '-v2' (etc.) to force a fresh 40-minute build with upstream updates
          key: radxa-base-${{ inputs.ubuntu_version }}-${{ matrix.flavor }}-v1

      # Run the long build process ONLY if the cache was empty (or key was bumped)
      - name: Build Radxa Image (Only if not cached)
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: |
          cd rsdk
          export LIBGUESTFS_BACKEND=direct
          ./src/bin/rsdk build radxa-dragon-q6a ${{ inputs.ubuntu_version }} ${{ matrix.flavor }}
          
          # Save a clean copy of the newly built image for the cache
          mkdir -p ../clean_base_image
          cp out/*/*.img ../clean_base_image/clean.img

      # Copy the clean base image to the output folder ready for injection
      # We work on a copy so the cached original remains untouched for future runs
      - name: Restore Base Image for Injection
        run: |
          mkdir -p rsdk/out/cache_restore
          cp clean_base_image/clean.img rsdk/out/cache_restore/output.img

      - name: Inject OmniMow First-Boot Script
        run: |
          dos2unix inject.sh omnimow-first-boot.sh
          cp inject.sh rsdk/
          cp omnimow-first-boot.sh rsdk/
          cd rsdk
          chmod +x inject.sh
          sudo ./inject.sh

      - name: Rename and Compress Image
        run: |
          cd rsdk
          # Find the original (now modified) image file
          ORIGINAL_IMG=$(ls out/*/*.img | head -n 1)
          
          # Create the new OmniMow name
          NEW_NAME="OmniMow-OS-${{ inputs.ubuntu_version }}-${{ matrix.flavor }}.img"
          
          # Rename and compress the file
          mv "$ORIGINAL_IMG" "$NEW_NAME"
          xz -z -T0 -9 "$NEW_NAME"

      - name: Upload finished OmniMow OS
        uses: actions/upload-artifact@v4
        with:
          name: OmniMow-OS-${{ inputs.ubuntu_version }}-${{ matrix.flavor }}
          path: rsdk/OmniMow-OS-${{ inputs.ubuntu_version }}-${{ matrix.flavor }}.img.xz

  release:
    needs: build-os
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OmniMow OS (${{ inputs.ubuntu_version }}) - Build ${{ github.run_number }}
          draft: false
          prerelease: false
          files: artifacts/**/*.img.xz
