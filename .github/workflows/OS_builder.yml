name: Build OmniMow OS

on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: 'Select Ubuntu Version (noble or resolute)'
        required: true
        default: 'resolute'
        type: choice
        options:
          - noble
          - resolute
      create_release:
        description: 'Create a public GitHub Release automatically?'
        required: true
        type: boolean
        default: true

jobs:
  build-os:
    runs-on: ubuntu-24.04-arm 
    strategy:
      matrix:
        flavor: [cli, gnome]

    steps:
      - name: Checkout OmniMow scripts
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git fdisk udev xz-utils bdebstrap mmdebstrap jsonnet libguestfs-tools gdisk linux-image-generic dos2unix
          sudo chmod +r /boot/vmlinuz-* || true

      - name: Install rsdk
        run: |
          git clone --recurse-submodules https://github.com/RadxaOS-SDK/rsdk.git

      # --- DYNAMIC CACHE KEY GENERATION ---
      - name: Generate Dynamic Cache Key
        id: cache-key-gen
        run: |
          # 1. Get the latest commit SHA from the official Radxa SDK repository
          RSDK_SHA=$(git ls-remote https://github.com/RadxaOS-SDK/rsdk.git HEAD | awk '{ print $1}')
          
          # 2. Get the current ISO week number (e.g., 42)
          WEEK_NUM=$(date +%V)
          
          # Save variables for the next step
          echo "rsdk_sha=$RSDK_SHA" >> $GITHUB_OUTPUT
          echo "week=$WEEK_NUM" >> $GITHUB_OUTPUT

      # --- CACHE CLEAN BASE IMAGE ---
      - name: Cache Clean Base Image
        id: cache-base
        uses: actions/cache@v4
        with:
          path: clean_base_image/
          key: radxa-base-${{ inputs.ubuntu_version }}-${{ matrix.flavor }}-${{ steps.cache-key-gen.outputs.rsdk_sha }}-week-${{ steps.cache-key-gen.outputs.week }}

      # --- LONG BUILD PROCESS (ONLY IF NO CACHE HIT) ---
      - name: Build Radxa Image (Only if not cached)
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: |
          cd rsdk
          export LIBGUESTFS_BACKEND=direct
          ./src/bin/rsdk build radxa-dragon-q6a ${{ inputs.ubuntu_version }} ${{ matrix.flavor }}
          
          # Save a clean copy of the newly built image to the cache folder
          mkdir -p ../clean_base_image
          cp out/*/*.img ../clean_base_image/clean.img

      # --- RESTORE AND PREPARE IMAGE FOR INJECTION ---
      - name: Restore Base Image for Injection
        run: |
          # We work on a copy so the cached original remains untouched for future runs
          mkdir -p rsdk/out/cache_restore
          cp clean_base_image/clean.img rsdk/out/cache_restore/output.img

      # --- INJECT CUSTOM DRIVERS AND FIXES ---
      - name: Inject OmniMow First-Boot Script
        run: |
          dos2unix inject.sh omnimow-first-boot.sh
          cp inject.sh rsdk/
          cp omnimow-first-boot.sh rsdk/
          cd rsdk
          chmod +x inject.sh
          sudo ./inject.sh

      # --- RENAME AND COMPRESS ---
      - name: Rename and Compress Image
        run: |
          cd rsdk
          # Find the modified image file
          ORIGINAL_IMG=$(ls out/*/*.img | head -n 1)
          
          # Create the new standardized OmniMow name
          NEW_NAME="OmniMow-OS-${{ inputs.ubuntu_version }}-${{ matrix.flavor }}.img"
          
          # Rename and compress the file
          mv "$ORIGINAL_IMG" "$NEW_NAME"
          xz -z -T0 -9 "$NEW_NAME"

      # --- UPLOAD ARTIFACT ---
      - name: Upload finished OmniMow OS
        uses: actions/upload-artifact@v4
        with:
          name: OmniMow-OS-${{ inputs.ubuntu_version }}-${{ matrix.flavor }}
          path: rsdk/OmniMow-OS-${{ inputs.ubuntu_version }}-${{ matrix.flavor }}.img.xz

  # --- CREATE GITHUB RELEASE ---
  release:
    needs: build-os
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OmniMow OS (${{ inputs.ubuntu_version }}) - Build ${{ github.run_number }}
          draft: false
          prerelease: false
          files: artifacts/**/*.img.xz
