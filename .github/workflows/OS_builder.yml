name: Build OmniMow OS

on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: 'Select Ubuntu Version (noble or resolute)'
        required: true
        default: 'resolute'
        type: choice
        options:
          - noble
          - resolute

jobs:
  build-os:
    runs-on: ubuntu-24.04-arm 
    strategy:
      # This matrix spins up two separate servers simultaneously
      matrix:
        flavor: [cli, gnome]

    steps:
      - name: Checkout OmniMow scripts
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git fdisk udev xz-utils bdebstrap mmdebstrap jsonnet libguestfs-tools gdisk linux-image-generic dos2unix
          # Grant supermin permission to read the kernel files
          sudo chmod +r /boot/vmlinuz-* || true

      - name: Install rsdk
        run: |
          git clone --recurse-submodules https://github.com/RadxaOS-SDK/rsdk.git

      - name: Build Radxa Image (${{ matrix.flavor }})
        run: |
          cd rsdk
          export LIBGUESTFS_BACKEND=direct
          # The ${{ matrix.flavor }} variable dynamically injects 'cli' or 'gnome'
          ./src/bin/rsdk build radxa-dragon-q6a ${{ inputs.ubuntu_version }} ${{ matrix.flavor }}

      - name: Inject OmniMow First-Boot Script
        run: |
          # Fix Windows line endings (CRLF -> LF) to prevent 'No such file' errors
          dos2unix inject.sh omnimow-first-boot.sh
          
          cp inject.sh rsdk/
          cp omnimow-first-boot.sh rsdk/
          cd rsdk
          chmod +x inject.sh
          # Ensure the inject script finds the image file in Radxa's subfolders
          sed -i 's|out/\*.img|out/*/*.img|g' inject.sh
          sudo ./inject.sh

      - name: Compress to .xz
        run: |
          cd rsdk
          xz -z -T0 -9 out/*/*.img

      - name: Upload finished OmniMow OS
        uses: actions/upload-artifact@v4
        with:
          # Automatically names the artifacts e.g., OmniMow-OS-resolute-cli and OmniMow-OS-resolute-gnome
          name: OmniMow-OS-${{ inputs.ubuntu_version }}-${{ matrix.flavor }}
          path: rsdk/out/*/*.img.xz
